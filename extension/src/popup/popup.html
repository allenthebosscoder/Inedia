<html>
  <head>

      #status { margin-top: 8px; font-size: 13px; color: #444; }
    </style>
  </head>
  <body>
    <div id="site-label">Detecting site…</div>
    <div id="profile-choices"></div>
    <button id="fill-button">Autofill this page</button>
